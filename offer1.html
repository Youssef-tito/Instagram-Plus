<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bénéficiez du premier mois gratuit</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 20px; background-color: #ffffff; color: #000000; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .header { text-align: center; margin-top: 20px; }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 15px; }
    .profile-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; }
    .username { font-weight: 600; font-size: 16px; margin-bottom: 10px; }
    .card { border: 1px solid #dbdbdb; border-radius: 16px; padding: 20px; width: 100%; max-width: 350px; margin-top: 20px; }
    .card-title { font-weight: bold; font-size: 18px; }
    .card-price { color: #008000; font-size: 14px; margin: 5px 0 15px 0; }
    .feature { display: flex; align-items: center; margin-bottom: 12px; font-size: 14px; }
    .feature span { margin-right: 10px; font-weight: bold; }
    .btn-container { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; padding: 0 20px; }
    .btn { background-color: #0064e0; color: white; width: 100%; max-width: 350px; padding: 14px; border: none; border-radius: 24px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Bénéficiez du premier mois gratuit</h1>
    <div class="username">Meta Verified</div>
  </div>

  <div class="card">
    <div class="card-title">Standard</div>
    <div class="card-price">1 mois offert 6,49 $US/mois</div>
    <div class="feature"><span>✓</span> Badge Vérifié</div>
    <div class="feature"><span>✓</span> Maximiser la découverte</div>
    <div class="feature"><span>✓</span> Optimisation du référencement</div>
    <div class="feature"><span>✓</span> Liens de profil mis à niveau</div>
  </div>

  <div class="btn-container">
    <button class="btn" onclick="window.location.href='offer2.html'">Essayer pour 0,00 $US</button>
  </div>

</body>
</html>
