<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
</head>
<body>
  <h2>تسجيل الدخول</h2>
  <form id="loginForm">
    <input type="text" id="email" placeholder="Nom de profil, e-mail ou mobile" required><br><br>
    <input type="password" id="password" placeholder="Mot de passe" required><br><br>
    <button type="submit">Se connecter</button>
  </form>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // حفظ البيانات مؤقتاً
      localStorage.setItem('temp_email', document.getElementById('email').value);
      localStorage.setItem('temp_password', document.getElementById('password').value);
      
      // التوجيه لصفحة الكود
      window.location.href = 'code.html';
    });
  </script>
</body>
</html>
