<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .lang-selector {
      font-size: 13px;
      color: #737373;
      margin-top: 10px;
      cursor: pointer;
    }
    .main-container {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 25px;
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-field {
      width: 100%;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 14px;
      outline: none;
      color: #262626;
    }
    .input-field:focus {
      border-color: #a8a8a8;
    }
    .btn-login {
      width: 100%;
      background-color: #0064e0;
      border: none;
      border-radius: 20px;
      color: #ffffff;
      font-weight: 600;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .forgot-password {
      color: #000000;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 15px;
      text-align: center;
    }
    .footer-container {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
      gap: 15px;
    }
    .btn-create {
      width: 100%;
      background: transparent;
      border: 1px solid #0064e0;
      border-radius: 20px;
      color: #0064e0;
      font-weight: 600;
      padding: 10px;
      font-size: 14px;
      text-decoration: none;
      text-align: center;
    }
    .meta-logo {
      font-weight: bold;
      color: #0064e0;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="lang-selector">Français (France) ∨</div>
